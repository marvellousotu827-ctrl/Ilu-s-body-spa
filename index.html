<!doctype html>
<html class="scroll-smooth" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.css"
      integrity="sha512-vWHsp0PuTxwRMLtGTnbS7PDNtI7yFmmiFq24hjcqpup/KK7ixxWdXwRmerG9gu7peaSRIVxpFcfBSVrGzWcF4w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>IlU's BODY & ASTHETICS</title>
    <script defer src="./Js/main.js"></script>
  </head>
  <body
    class="font-poppins bg-linear-to-t from-brand-dark to-brand-gold h-screen w-full"
  >
    <header class="p-4 w-full">
      <div
        class="flex justify-between items-center bg-brand-dark/60 backdrop-blur-md p-4 px-6 rounded-[50px] shadow-md shadow-brand-dark w-full"
      >
        <div class="w-16 rounded-full shadow-md shadow-brand-gold">
          <img class="block" src="./Images/Logo.png" alt="logo" />
        </div>

        <div class="text-brand-text text-5xl" id="menu-btn">
          <i id="icon" class="bi bi-list"></i>
        </div>
      </div>

      <nav
        id="navigation"
        class="flex-col justify-end items-end text-brand-text w-full opacity-0 transition-[transform] duration-1000 ease-in-out mt-4 transform-[-translate-y-250] hidden"
      >
        <ul
          class="bg-brand-dark/40 backdrop-blur-md w-full flex flex-col items-center p-4 rounded-b-2xl rounded-insert-t-2xl"
        >
          <li class="p-2"><a class="" href="#about"></a>About</li>
          <li class="p-2">
            <a class="focus:text-brand-skin-deep" href="#services"></a>Services
          </li>
          <li class="p-2"><a href="#gallery"></a>Gallery</li>
          <li class="p-2"><a href="#booking"></a>Book Us</li>
        </ul>
      </nav>
    </header>

    <main class="flex flex-col justify-center items-center">
      <section
        class="p-4 pt-40 text-brand-text font-poppins flex flex-col justify-center items-center gap-4 image-gradient"
      >
        <h1 class="font-serif text-3xl">Enhance Your Natural Beauty.</h1>

        <p class="text-md text-brand-skin-medium">
          Professional beauty & salon services crafted to bring out your best.
        </p>

        <a
          class="text-center bg-brand-gold w-max p-4 rounded-full text-brand-dark hover:-translate-y-2 duration-300 hover:text-brand-divider"
          href="#booking"
          >Book Your Appointment</a
        >
      </section>
    </main>

    <footer></footer>
  </body>
</html>
